[package]
name = "hypatia-mcp-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["http2"] }
rmcp = { version = "3.1.2", features = ["server", "transport-streamable-http-server"] }
schemars = "1.2.2"
serde = "1.0.229"
tokio = { version = "1.53.1", features = ["full"] }

